<style>
/* Site chrome. Layout: header, sidebar of components, and a page with a desk preview, a controls column and live code. */
:root {
  color-scheme: light;
  --bg: #f4f2ec;
  --fg: #24262c;
  --muted: #6c6a64;
  --line: #dcd8ce;
  --panel: #ebe8e0;
  --code: #efece5;
  --accent: #213c6b;
  --mark: #fff04a;
  --f-ui: "Courier Prime", "Courier New", monospace;
  --f-head: "Special Elite", "Courier Prime", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1f1e1c; --fg: #e9e6de; --muted: #a29f97; --line: #3a3834; --panel: #2a2926; --code: #262522; --accent: #a9bde6; --mark: #6d6418; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1f1e1c; --fg: #e9e6de; --muted: #a29f97; --line: #3a3834; --panel: #2a2926; --code: #262522; --accent: #a9bde6; --mark: #6d6418; color-scheme: dark; --pt-desk: #2b2a27; --pt-desk-ink: #cfccc3; }
:root[data-theme="light"] { --pt-desk: #cdcbc5; --pt-desk-ink: #3a3c42; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 15px/24px var(--f-ui); }
a { color: var(--accent); }
::selection { background: color-mix(in srgb, var(--mark) 70%, transparent); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); }
.brand b { font: 700 28px/32px "Caveat", cursive; color: var(--accent); }
.brand span { font-size: 12px; color: var(--muted); }
.top-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-left: auto; font-size: 13px; }
.top-ctl label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
select:not(.pt-input), input[type="text"]:not(.pt-input), textarea:not(.pt-input) { font: 13px/18px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; }
textarea:not(.pt-input) { width: 100%; min-height: 168px; resize: vertical; white-space: pre; }
select:focus-visible, input:not(.pt-input):focus-visible, textarea:not(.pt-input):focus-visible, button:focus-visible, a:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--fg); background: color-mix(in srgb, var(--mark) 75%, transparent); }

/* navigation */
.menu-btn { display: none; align-items: center; gap: 6px; font: inherit; font-size: 14px; color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px 4px 8px; cursor: pointer; }
.here { display: none; }
.inks-link { font-size: 13px; text-decoration: none; padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--fg); }
.side-settings .inks-link { justify-self: start; border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.wrap { display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
.side { position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto; padding: 16px 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); }
.side-head, .side-settings:empty { display: none; }
.find { position: relative; display: block; margin-bottom: 14px; }
.find input { width: 100%; font: 13px/18px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 30px 6px 8px; }
.find kbd { position: absolute; right: 7px; top: 5px; font: 11px var(--f-ui); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.side h4 { margin: 16px 0 2px; font: 400 11px/18px var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.side a { display: block; padding: 2px 8px; margin: 0 -8px; color: var(--fg); text-decoration: none; font-size: 14px; line-height: 26px; border-radius: 3px; }
.side a:hover { background: var(--panel); }
/* the current page is picked out with the library's own highlighter */
.side a .pt-mark { --pt-hl: var(--pt-hl-yellow); padding: 1px .3em; margin: 0 -.3em; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .side a .pt-mark { mix-blend-mode: normal; color: #24262c; } }
:root[data-theme="dark"] .side a .pt-mark { mix-blend-mode: normal; color: #24262c; }
.nothing { font-size: 13px; color: var(--muted); }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(20, 18, 14, .4); }
main#page { min-width: 0; padding: 28px 32px 80px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
@media (max-width: 860px) {
  .menu-btn { display: inline-flex; }
  .brand span { display: none; }
  .here { display: block; min-width: 0; flex: 1; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .top { flex-wrap: nowrap; gap: 12px; }
  .top > .top-ctl { display: none; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; max-height: none;
    width: min(320px, 86vw); padding: 0 18px 32px; padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--bg); border-right: 1px solid var(--line); box-shadow: 8px 0 30px rgba(0,0,0,.18);
    transform: translateX(-105%); transition: transform .25s ease; visibility: hidden;
  }
  .side.open { transform: none; visibility: visible; }
  .side-head { display: flex; justify-content: space-between; align-items: center; height: 52px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .side-head b { font: 700 24px "Caveat", cursive; color: var(--accent); }
  .side-head button { font: 13px var(--f-ui); color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .side-settings:not(:empty) { display: block; padding: 4px 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .side-settings .top-ctl { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 0; }
  .side-settings label { justify-content: space-between; }
  .side-settings select { min-width: 140px; }
  .find kbd { display: none; }
  .side a { line-height: 36px; font-size: 15px; }
  main#page { padding: 20px 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .pager a { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* page */
.crumb { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
h1.title { margin: 2px 0 6px; font: 400 34px/44px var(--f-head); text-wrap: balance; }
.lead { margin: 0 0 24px; max-width: 64ch; color: color-mix(in srgb, var(--fg) 82%, var(--bg)); }
.page h2 { margin: 36px 0 10px; font: 400 22px/32px var(--f-head); }
.page p { max-width: 68ch; }
.play { display: grid; grid-template-columns: minmax(0, 1fr) 272px; border: 1px solid var(--line); border-radius: 8px; overflow: clip; }
@media (max-width: 1100px) { .play { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; min-width: 0; background: var(--pt-desk); padding: 28px; overflow: hidden; }
.stage > .pt-sheet { --pt-sheet-width: 760px; }
/* on a phone the preview and its settings take turns: a toggle switches between them, so nothing has to scroll inside anything */
.play-tabs { display: none; }
@media (max-width: 860px) {
  .play-tabs { display: flex; gap: 0; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: max-content; }
  .play-tabs button { font: 14px var(--f-ui); color: var(--muted); background: none; border: 0; padding: 7px 18px; cursor: pointer; }
  .play-tabs button[aria-selected="true"] { color: var(--fg); background: color-mix(in srgb, var(--mark) 75%, transparent); }
  .play[data-view="preview"] > .ctls, .play[data-view="settings"] > .stage { display: none; }
  .play[data-view="settings"] > .ctls { border-top: 0; }
}
@media (max-width: 600px) { .stage { padding: 14px; } }
.ctl[hidden] { display: none; }
.ctl small { color: var(--muted); font-size: 12px; line-height: 16px; }
.stage-tools { position: absolute; top: 8px; right: 10px; display: flex; gap: 8px; z-index: 4; }
.stage-tools button { font: 12px var(--f-ui); color: var(--pt-desk-ink); background: color-mix(in srgb, var(--pt-desk) 70%, #fff 30%); border: 0; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
.ctls { display: flex; flex-direction: column; gap: 14px; padding: 18px; background: var(--bg); border-left: 1px solid var(--line); min-width: 0; }
@media (max-width: 1100px) { .ctls { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } .ctls .wide { grid-column: 1 / -1; } }
.ctls h3 { margin: 0; font: 400 11px/18px var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.ctl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 18px; }
.ctl > span, .ctl > label > span { display: flex; justify-content: space-between; color: var(--muted); }
.ctl output { color: var(--fg); }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctl.check { flex-direction: row; align-items: center; gap: 8px; }
.code { position: relative; margin-top: 16px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; }
.code pre { margin: 0; padding: 14px 16px; padding-right: 72px; overflow-x: auto; font: 13px/20px var(--f-ui); color: var(--fg); white-space: pre; tab-size: 2; }
.code .copy { position: absolute; top: 8px; right: 8px; font: 12px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
.code-label { margin: 22px 0 0; font-size: 11px; line-height: 18px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.ref-wrap { overflow-x: auto; }
table.ref { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.ref th, .ref td { text-align: left; vertical-align: top; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
.ref th { font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.ref td:first-child { white-space: nowrap; }
.ref code, .page p code, .page li code { font: 13px var(--f-ui); background: var(--code); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.grid-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.grid-links a { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--fg); }
.grid-links a:hover { background: var(--panel); }
.grid-links b { display: block; font: 400 17px/24px var(--f-head); }
.grid-links span { font-size: 13px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager a { text-decoration: none; font-size: 14px; }
.pager small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.status { font: 20px "Caveat", cursive; color: var(--pt-pencil); }

/* preview helpers */
.row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.row.center { align-items: center; }
.row.pad { padding-block: 24px; }
.hero-sheet { --pt-sheet-width: 760px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 8px 24px; }
.lab-sample, .lab-plain { font-size: 26px; line-height: 36px; color: var(--pt-ribbon); max-width: none; }
.pt-sheet p.lab-sample { filter: url(#tw-lab); }
.pt-sheet p.lab-plain { filter: none; }
.lab-sample .c { display: inline-block; }
/* playground */
.pg { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); border: 1px solid var(--line); border-radius: 8px; overflow: clip; min-height: 560px; }
.pg-code { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--code); }
.pg-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.pg-bar label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.pg-bar button { font: 12px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
.pg-insert { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pg-insert b { width: 100%; font: 400 11px/16px var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.pg-insert button { font: 12px var(--f-ui); color: var(--fg); background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 2px 10px; cursor: pointer; }
.pg-insert button:hover { border-style: solid; }
.pg textarea#pg-src { flex: 1; width: 100%; min-height: 360px; border: 0; border-radius: 0; background: transparent; padding: 14px; font: 13px/20px var(--f-ui); white-space: pre; tab-size: 2; resize: none; }
.pg .stage { overflow: auto; }
@media (max-width: 1100px) { .pg { grid-template-columns: minmax(0, 1fr); } .pg-code { border-right: 0; border-bottom: 1px solid var(--line); } .pg textarea#pg-src { min-height: 300px; } }
@media (max-width: 860px) { .pg[data-view="preview"] > .pg-code, .pg[data-view="settings"] > .stage { display: none; } }
.col-sheet { --pt-sheet-width: 100%; padding: 24px; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 24px; }
.col { align-content: start; }
.col .col-name { justify-self: start; font-family: var(--pt-font-type); font-size: 14px; line-height: 20px; color: var(--pt-ink); }
.col .col-m { font-family: var(--pt-font-type); font-size: 12px; line-height: 16px; opacity: .65; color: var(--pt-ink); }
.col code { font: 11px/16px var(--pt-font-type); color: var(--pt-ink); opacity: .8; }
.col-paper { display: block; height: 40px; border-radius: 2px; box-shadow: 0 0 0 .5px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.1); }
.col-hl, .col-stamp { display: flex; align-items: center; height: 40px; font-family: var(--pt-font-type); }
.col-stamp { height: 68px; }
.col-jump { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 16px 0 0; font-size: 13px; }
.col-count { font: 12px var(--f-ui); color: var(--muted); }
.col-note { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
div.col { cursor: default; } .col-stamp .pt-stamp { font-size: 18px; }
.col[aria-pressed="true"] .col-name { background: var(--pt-mark-y) 0 70% / 100% 70% no-repeat; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .6; font-family: var(--pt-font-type); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="lab-defs"></svg>

<header class="top">
  <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="side"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.2 C 7 4.8, 12 5.4, 17.5 4.9 M2.8 10.2 C 8 9.9, 12 10.4, 17.2 10 M2.5 15.1 C 7 14.8, 12 15.3, 17.4 14.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Menu</span></button>
  <a class="brand" href="#intro"><b>papertooth</b><span id="version"></span></a>
  <span class="here" id="here"></span>
  <div class="top-ctl" id="settings" role="group" aria-label="Site settings">
    <label>Writing <span class="seg" id="g-mode"><button type="button" data-v="type" aria-pressed="true">typed</button><button type="button" data-v="hand" aria-pressed="false">by hand</button></span></label>
    <label for="g-paper">Paper <select id="g-paper"><option>white</option><option>cream</option><option>washi</option><option>kraft</option><option>recycled</option><option>tracing</option></select></label>
    <label for="g-ruling">Ruling <select id="g-ruling"><option>dot</option><option>grid</option><option>graph</option><option>lined</option><option>blank</option></select></label>
    <label for="g-tex">Texture <select id="g-tex"><option value="full">full</option><option value="light">light</option><option value="off">off</option></select></label>
    <a class="inks-link" href="#colours">Inks</a>
  </div>
</header>
<div class="scrim" id="scrim" hidden></div>
<div class="wrap">
  <nav class="side" id="side" aria-label="Components">
    <div class="side-head"><b>Menu</b><button type="button" id="side-close" aria-label="Close menu">Close</button></div>
    <div class="side-settings" id="side-settings"></div>
    <label class="find" for="find"><span class="sr">Find a component</span><input type="search" id="find" placeholder="Find a component" autocomplete="off"><kbd>/</kbd></label>
    <div id="nav-list"></div>
    <p class="nothing" id="nothing" hidden>Nothing matches. Try “stamp” or “chart”.</p>
  </nav>
  <main id="page" class="page"></main>
</div>

<script src="papertooth.min.js"></script>
<script>
(function () {
'use strict';
const PT = window.Papertooth, html = document.documentElement;
const kit = PT.init();   // draws everything as it comes into view; the live previews stay still (data-pt-draw="off")
// the version of the script actually running, so the header never falls behind a release
document.getElementById('version').textContent = 'v' + PT.VERSION;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const IMG = { lake: 'img/lake.jpg', coffee: 'img/coffee.jpg' };
const IMG_ALT = { lake: 'A mountain lake at dusk, with pines on both shores', coffee: 'A cup of coffee and a notebook on a wooden desk, seen from above' };

/* ---------- palettes ---------- */
const INKS = PT.PALETTE.inks.map(([t, n, k, m]) => [t, `${n}${k ? ' ' + k : ''} ${m}`.trim()]);
const COLOUR_PENCILS = PT.PALETTE.colourPencils.map(([t, n]) => [t, n]);
const GRAPHITES = PT.PALETTE.graphite.map(([t, n, k, m]) => [t, m ? `${n}, ${m}` : n]);
const BALLPOINTS = PT.PALETTE.ballpoints.map(([t, n]) => [t, n]);

/** A name seal: Japanese names stacked down an oval, Latin names across a round seal. */
function nameSeal(text, w) {
  const t = (text || 'トマス').trim();
  const chars = [...t].slice(0, 5);
  if (/[぀-ヿ㐀-鿿]/.test(t)) {
    const n = chars.length, fs = n > 3 ? 13 : 15, h = 16 + n * (fs + 2);
    return `<svg width="${w || 40}" height="${Math.round((w || 40) / 40 * (h + 6))}" viewBox="0 0 40 ${h + 6}" role="img" aria-label="Name seal: ${esc(t)}"><ellipse cx="20" cy="${(h + 6) / 2}" rx="17" ry="${(h + 6) / 2 - 3}" fill="none" stroke="currentColor" stroke-width="2.6"/>${chars.map((c, i) => `<text class="pt-jp" x="20" y="${11 + (i + 1) * (fs + 2) - 2}" text-anchor="middle" font-size="${fs}" fill="currentColor">${esc(c)}</text>`).join('')}</svg>`;
  }
  const word = t.toUpperCase().slice(0, 10), fs = Math.min(14, 44 / (Math.max(3, word.length) * .62));
  return `<svg width="${w || 68}" height="${w || 68}" viewBox="0 0 68 68" role="img" aria-label="Name seal: ${esc(t)}"><circle cx="34" cy="34" r="31" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="34" cy="34" r="26.5" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="34" y="${34 + fs * .36}" text-anchor="middle" font-family="Courier Prime, monospace" font-weight="700" font-size="${fs.toFixed(1)}" letter-spacing="1" fill="currentColor">${esc(word)}</text></svg>`;
}

    </main></div></div>
    <h2>What is inside</h2>
    <div class="grid-links">${GROUP_LINKS()}</div>
    <h2>How it works</h2>
    <p>The CSS works on its own: paper, tape, notes, stamps, forms and every variant are classes and data attributes. A small optional script adds what CSS cannot do: ink textures as SVG filters, shapes drawn at each element's real size, text snapped to the grid, image effects and diagrams. It draws only what is near the screen and goes fully idle afterwards.</p>
    <p>Nothing is rotated unless you ask for it. Give any note, stamp, tape, card or photo a <code>--pt-rot</code> to set it at an angle.</p>
    <p>Anything drawn can be drawn with any instrument: fountain pen, ballpoint, brush pen, felt marker, graphite or coloured pencil. Put <code>data-tool</code> on it.</p>` });

page({ id: 'playground', group: 'Getting started', title: 'Playground', keywords: 'editor sandbox try', lead: 'Write any HTML with Papertooth classes and see it on paper as you type. Start from a page, or drop in pieces from the list.',
  custom: () => `<div class="play-tabs" role="tablist" aria-label="Show"><button type="button" role="tab" data-view="settings" aria-selected="true">Code</button><button type="button" role="tab" data-view="preview" aria-selected="false">Preview</button></div>
  <div class="pg" data-view="settings">
    <div class="pg-code">
      <div class="pg-bar"><label for="pg-tpl">Start from <select id="pg-tpl">${Object.keys(PG_TEMPLATES).map(k => `<option value="${k}">${PG_TEMPLATES[k].name}</option>`).join('')}</select></label><button type="button" id="pg-copy">Copy</button></div>
      <div class="pg-insert"><b>Insert at the cursor</b>${PG_SNIPS.map(([l], i) => `<button type="button" data-i="${i}">${l}</button>`).join('')}</div>
      <label class="sr" for="pg-src">HTML</label><textarea id="pg-src" spellcheck="false"></textarea>
    </div>
    <div class="stage" id="stage"><div class="stage-tools"><button type="button" id="pg-replay">Draw again</button></div><div class="pt-sheet" id="pg-out" data-pt-draw="off" ${sheetAttrs()}></div></div>
  </div>`,
  mount: () => {
    const src = document.getElementById('pg-src'), out = document.getElementById('pg-out'), tpl = document.getElementById('pg-tpl');
    let t = 0;
    const run = () => { out.innerHTML = src.value; kit.scan(out); kit.refresh(out); };
    const load = k => { src.value = PG_TEMPLATES[k].html; run(); };
    src.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 250); });
    src.addEventListener('keydown', e => { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); src.setRangeText('  ', src.selectionStart, src.selectionEnd, 'end'); } });
    tpl.addEventListener('change', () => load(tpl.value));
    document.querySelector('.pg-insert').addEventListener('click', e => {
      const b = e.target.closest('button[data-i]'); if (!b) return;
      src.focus(); src.setRangeText(PG_SNIPS[+b.dataset.i][1], src.selectionStart, src.selectionEnd, 'end'); run();
    });
    document.getElementById('pg-copy').addEventListener('click', e => copy({ textContent: src.value }, e.target));
    document.getElementById('pg-replay').addEventListener('click', () => {
      out.querySelectorAll(DRAWABLE).forEach((it, i) => it.style.setProperty('--pt-delay', Math.min(i * .12, 1.2).toFixed(2) + 's'));
      drawOnce(out);
    });
    load(tpl.value);
  } });

page({ id: 'install', group: 'Getting started', title: 'Installation', lead: 'Install the package, or load two files from a CDN.',
  custom: () => `
    <p class="code-label">npm</p>${codeBox('npm install papertooth')}
    ${codeBox(`import 'papertooth/css';
import { init } from 'papertooth';

const kit = init({ pen: 'ink-ai', motion: 'scroll' });`)}
    <p class="code-label">CDN, no build step</p>
    ${codeBox(`<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/papertooth@0.3/dist/papertooth.min.css">
<script src="https://cdn.jsdelivr.net/npm/papertooth@0.3/dist/papertooth.min.js" defer data-pt-auto><\/script>`)}
    <p><code>data-pt-auto</code> starts the script on load. Pass options as JSON: <code>data-pt-auto='{"seed": 7}'</code>. The running instance is <code>window.Papertooth.kit</code>.</p>
    <h2>Fonts</h2>
    <p>Fonts are not bundled. The defaults are Courier Prime, Special Elite and Caveat, plus Shippori Mincho B1 and Zen Maru Gothic for Japanese stamps. Swap any of them in <a href="#theming">Theming</a>.</p>
    ${codeBox('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap">')}
    <h2>A first page</h2>
    ${codeBox(`<body class="pt-desk">
  <main class="pt-sheet" data-paper="dot">
    <h1 class="pt-wobble">A typed heading</h1>
    <p>Some text with a <mark class="pt-mark">highlight</mark> and a <a class="pt-link" href="#">link</a>.</p>
    <a class="pt-btn" href="#">Hire me</a>
  </main>
</body>`)}
    <h2>Without the script</h2>
    <p>Everything still renders, with a fixed version of each drawn shape. For the textures, paste <code>dist/papertooth-filters.svg</code> into the page and add <code>class="pt-filters"</code> to <code>&lt;html&gt;</code>. Lithograph, printer and diagrams need the script.</p>` });

page({ id: 'colours', group: 'Getting started', title: 'Inks and colours', keywords: 'palette colour scheme inks japanese wisteria fuji pen pencil ballpoint ribbon highlighter stamp paper theme', lead: 'Every ink, pencil, ribbon, highlighter, stamp pad and paper in Papertooth, in one place. The fountain pen inks are named after traditional Japanese colours (伝統色, dentō-shoku). Click any of them to use it across the site, then copy the settings.',
  custom: () => {
    const S = COLOURS_IN_USE;
    const groups = [
      ['Fountain pen, brush pen and marker', 'inks', 'fountain', 'pen', 'The same bottled inks fill all three. Choose which one a click sets:'],
      ['Ballpoint', 'ballpoints', 'ballpoint', 'ballpoint', ''],
      ['Graphite pencil', 'graphite', 'pencil', 'graphite', 'Hatching, shading and anything drawn in graphite.'],
      ['Coloured pencil', 'colourPencils', 'pencil', 'pencil', 'Notes and marks on text.'],
      ['Typewriter ribbon', 'ribbons', 'fountain', 'ribbon', 'Typed text.'],
      ['Highlighter', 'highlighters', 'highlighter', 'hl', ''],
      ['Stamp pad', 'stamps', 'stamp', '', 'Set on each stamp with data-ink.'],
      ['Paper', 'papers', 'paper', 'paper', 'Set on each sheet with data-paper.']
    ];
    const sw = (g, tool, use, [t, n, k, m, hex]) => {
      const chip = g === 'papers' ? `<span class="col-paper" style="background:${hex}"></span>`
        : g === 'highlighters' ? `<span class="col-hl"><mark class="pt-mark" style="--pt-hl: var(--pt-${t})">highlight</mark></span>`
        : g === 'stamps' ? `<span class="col-stamp"><span class="pt-stamp pt-stamp--round" style="color: var(--pt-${t})">印</span></span>`
        : `<span class="pt-swatch__ink"></span>`;
      const tag = use ? 'button' : 'div';
      const on = use && (use === 'paper' ? G.paper === t : S[use] === t);
      return `<${tag} class="pt-swatch col"${use ? ` type="button" aria-pressed="${on}"` : ''}${g === 'inks' ? ' data-group-inks' : ''} data-use="${use}" data-tool="${tool === 'pencil' ? 'pencil' : tool === 'ballpoint' ? 'ballpoint' : 'fountain'}" data-token="${t}" style="--pt-swatch: ${g === 'papers' ? hex : `var(--pt-${t})`}">${chip}<span class="col-name">${esc(n)}${k ? ` <span class="pt-jp">${k}</span>` : ''}</span>${m ? `<span class="col-m">${esc(m)}</span>` : ''}<code>${g === 'papers' ? `data-paper="${t}"` : g === 'stamps' ? `data-ink="${t.replace('stamp-', '')}"` : `--pt-${t}`}</code><span class="col-m">${hex}</span></${tag}>`;
    };
    return `<div class="play" style="grid-template-columns:1fr"><div class="stage"><div class="pt-sheet" id="col-sample" ${sheetAttrs()}>${INK_SAMPLE}</div></div></div>
      <nav class="col-jump" aria-label="Jump to">${groups.map(([title], i) => `<a href="#colours" data-jump="col-${i}">${title}</a>`).join('')}</nav>`
      + groups.map(([title, g, tool, use, note], i) => `<h2 id="col-${i}">${title} <small class="col-count">${PT.PALETTE[g].length}</small></h2>${note ? `<p class="col-note">${note}</p>` : ''}${g === 'inks' ? `<p class="col-note"><span class="seg" id="ink-for"><button type="button" data-for="pen" aria-pressed="true">fountain pen</button><button type="button" data-for="brush" aria-pressed="false">brush pen and marker</button></span></p>` : ''}<div class="pt-sheet col-sheet" ${sheetAttrs()}><div class="cols">${PT.PALETTE[g].map(x => sw(g, tool, use, x)).join('')}</div></div>`).join('')
      + `<h2>In your stylesheet</h2>${codeBox(coloursCode(), 'col-code')}<p>The same list is exported as <code>PALETTE</code> from the script, if you need the names and values in JavaScript.</p>`;
  },
  mount: () => {
    main.querySelectorAll('.col-jump a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
    const inkFor = document.getElementById('ink-for');
    if (inkFor) inkFor.addEventListener('click', e => {
      const b = e.target.closest('button[data-for]'); if (!b) return;
      inkFor.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      main.querySelectorAll('button.col[data-group-inks]').forEach(o => { o.dataset.use = b.dataset.for; o.setAttribute('aria-pressed', String(COLOURS_IN_USE[b.dataset.for] === o.dataset.token)); });
    });
    main.querySelectorAll('button.col').forEach(b => b.addEventListener('click', () => {
      const use = b.dataset.use, t = b.dataset.token;
      if (use === 'paper') { const sel = document.getElementById('g-paper'); sel.value = t; sel.dispatchEvent(new Event('change')); }
      else { COLOURS_IN_USE[use] = t; applyColours(use); }
      main.querySelectorAll(`button.col[data-use="${use}"]`).forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      const code = document.getElementById('col-code'); if (code) code.textContent = coloursCode();
    }));
  } });

page({ id: 'theming', group: 'Getting started', title: 'Theming', lead: 'Every effect is a CSS custom property. Set the grid, the paper and the fonts here and the whole site follows; copy the result into your own stylesheet. Inks and colours have their own page.',
  controls: [
    { k: 'grid', label: 'Grid', type: 'range', min: 16, max: 32, step: 2, unit: 'px', v: 24 },
    { k: 'dot', label: 'Dot size', type: 'range', min: .4, max: 1.4, step: .05, unit: 'px', v: .8 },
    { k: 'dotAlpha', label: 'Dot strength', type: 'range', min: .08, max: .5, step: .02, v: .26 },
    { k: 'grain', label: 'Paper grain', type: 'range', min: 0, max: 1, step: .05, v: .28 },
    { k: 'wobble', label: 'Letter wobble', type: 'range', min: 0, max: 2, step: .1, v: 1 },
    { k: 'typeFont', label: 'Typewriter font', type: 'select', options: [['"Courier Prime", monospace', 'Courier Prime'], ['"IBM Plex Mono", monospace', 'IBM Plex Mono'], ['"JetBrains Mono", monospace', 'JetBrains Mono'], ['"Space Mono", monospace', 'Space Mono']], v: '"Courier Prime", monospace' },
    { k: 'handFont', label: 'Handwriting font', type: 'select', options: [['"Caveat", cursive', 'Caveat'], ['"Kalam", cursive', 'Kalam'], ['"Nanum Pen Script", cursive', 'Nanum Pen Script']], v: '"Caveat", cursive' }
  ],
  apply: s => {
    const r = html.style;
    r.setProperty('--pt-grid', s.grid + 'px'); r.setProperty('--pt-dot-size', s.dot + 'px');
    r.setProperty('--pt-dot', `rgba(88, 86, 80, ${s.dotAlpha})`); r.setProperty('--pt-grain', s.grain);

  code: s => `:root {
  --pt-grid: ${s.grid}px;

  --pt-dot: rgba(88, 86, 80, ${s.dotAlpha});
  --pt-grain: ${s.grain};
  --pt-wobble: ${s.wobble};
  --pt-font-type: ${s.typeFont};
  --pt-font-hand: ${s.handFont};
}`,
  after: () => `<p>Pens, pencils, ribbons and highlighters: see <a href="#colours">Inks and colours</a>.</p>
    ${refTable([['--pt-grid', '24px', 'Dot pitch and line height. Text snaps to it.'], ['--pt-sheet-width', '720px', 'Widest the sheet gets, rounded down to whole cells.'], ['--pt-paper, --pt-desk', '#fcfbf7, #cdcbc5', 'Paper and desk colours.'], ['--pt-dot, --pt-dot-size', 'warm grey, .8px', 'Printed dots.'], ['--pt-line', 'pale blue', 'Ruling on grid, graph and lined paper.'], ['--pt-grain', '.28', 'Paper grain, 0 to 1.'], ['--pt-pen, --pt-pencil, --pt-ribbon', 'indigo, red pencil, black', 'Current tools.'], ['--pt-hl', 'yellow', 'Highlighter colour.'], ['--pt-wobble', '1', 'Letter wobble, 0 to 2.'], ['--pt-tilt', '1', 'Multiplies every --pt-rot, 0 to 2.'], ['--pt-draw, --pt-ease', '.75s', 'Drawing-on timing.'], ['--pt-font-type, -hand, -type-head, -jp', 'Courier Prime, Caveat…', 'Fonts.'], ['--pt-s-body, -small, -h1, -h2', '20, 16, 36, 26px', 'Type sizes.']])}` });

const litho = (s, extra = {}) => {

  if (s.mode === 'tri') Object.assign(v, { '--pt-litho-blue': s.p1 !== '#3a82c4' ? s.p1 : '', '--pt-litho-red': s.p2 !== '#d8466c' ? s.p2 : '', '--pt-litho-yellow': s.p3 !== '#f2c640' ? s.p3 : '', '--pt-litho-offset': s.offset !== 1.5 ? s.offset : '' });
  else Object.assign(v, { '--pt-litho-ink': s.ink !== 'ink-sumi' ? `var(--pt-${s.ink})` : '' });

};

  </span>

const PAGES_BY = Object.fromEntries(PAGES.map(p => [p.id, p]));

}));
document.getElementById('g-paper').addEventListener('change', e => { G.paper = e.target.value; document.querySelectorAll('#page .pt-sheet:not(.paper-own)').forEach(s => s.dataset.paper = G.paper); });

/* ---------- rendering ---------- */
const nav = document.getElementById('side'), list = document.getElementById('nav-list'), main = document.getElementById('page');
const find = document.getElementById('find'), nothing = document.getElementById('nothing');

list.innerHTML = GROUPS.map(g => `<div class="nav-group"><h4>${g}</h4>` + PAGES.filter(p => p.group === g).map(p => `<a href="#${p.id}" data-id="${p.id}" data-words="${esc((p.title + ' ' + p.group + ' ' + (p.keywords || '') + ' ' + p.lead).toLowerCase())}"><span>${p.title}</span></a>`).join('') + '</div>').join('');
find.addEventListener('input', () => {
  const q = find.value.trim().toLowerCase();
  let any = false;
  list.querySelectorAll('.nav-group').forEach(grp => {
    let shown = 0;
    grp.querySelectorAll('a').forEach(a => { const ok = !q || a.dataset.words.includes(q); a.hidden = !ok; if (ok) shown++; });
    grp.hidden = !shown; if (shown) any = true;
  });
  nothing.hidden = any;
});
find.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const first = list.querySelector('a:not([hidden])'); if (first) { location.hash = first.dataset.id; find.value = ''; find.dispatchEvent(new Event('input')); } }
  if (e.key === 'Escape') { find.value = ''; find.dispatchEvent(new Event('input')); find.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); if (narrow.matches) openMenu(); find.focus(); }
  if (e.key === 'Escape' && nav.classList.contains('open')) closeMenu();
});

// on small screens the sidebar becomes a drawer, and the site settings move into it
const narrow = matchMedia('(max-width: 860px)');
const settings = document.getElementById('settings'), sideSettings = document.getElementById('side-settings'), top = document.querySelector('.top');
function placeSettings() { if (narrow.matches) sideSettings.appendChild(settings); else top.appendChild(settings); }

function openMenu() {

function codeBox(text, id) { return `<div class="code"><pre${id ? ` id="${id}"` : ''}>${esc(text)}</pre><button class="copy" type="button">Copy</button></div>`; }
function refTable(rows) { return rows && rows.length ? `<h2>Parameters</h2><div class="ref-wrap"><table class="ref"><thead><tr><th>Setting</th><th>Default</th><th>Values</th></tr></thead><tbody>${rows.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>` : ''; }
function swatch(kind, tool, token, label) { return `<button class="pt-swatch" type="button" data-kind="${kind}" data-tool="${tool}" data-token="${token}" style="--pt-swatch: var(--pt-${token})"><span class="pt-swatch__ink"></span><span class="pt-swatch__name">${label}</span></button>`; }
function control(c, v) {
  const id = 'c-' + c.k;

  if (c.type === 'range') return `<div class="ctl" data-k="${c.k}"><label for="${id}"><span>${c.label}<output id="${id}-o">${v}${c.unit || ''}</output></span></label><input type="range" id="${id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}">${note}</div>`;
  if (c.type === 'toggle') return `<label class="ctl check" data-k="${c.k}" for="${id}"><input type="checkbox" id="${id}"${v ? ' checked' : ''}><span>${c.label}</span></label>`;
  if (c.type === 'textarea') return `<label class="ctl wide" for="${id}"><span>${c.label}</span><textarea id="${id}" spellcheck="false" rows="8">${esc(v)}</textarea></label>`;
  return `<label class="ctl" data-k="${c.k}" for="${id}"><span>${c.label}</span><input type="text" id="${id}" value="${esc(v)}"></label>`;
}
const STATE = {};
const DRAWABLE = '.pt-anno, .pt-btn, .pt-rule, .pt-link, .pt-mark, .pt-stamp, .pt-tape, .pt-sticky, .pt-flag, .pt-torn, .pt-ticket, .pt-photo, .pt-postage, .pt-label, .pt-progress, .pt-printout, .pt-diagram, .pt-draw-path';

function show(id) {
  const p = PAGES_BY[id] || PAGES[0];
  document.title = p.id === 'intro' ? 'Papertooth' : `${p.title} · Papertooth`;
  nav.querySelectorAll('#nav-list a').forEach(a => {
    const on = a.dataset.id === p.id, t = a.firstElementChild;

      else { t.className = ''; t.removeAttribute('data-hl'); t.style.removeProperty('--pt-mark'); }
    }
  });
  here.textContent = p.id === 'intro' ? '' : p.title;
  closeMenu();
  const s = STATE[p.id] || (STATE[p.id] = Object.fromEntries((p.controls || []).map(c => [c.k, c.v])));
  const i = PAGES.indexOf(p), prev = PAGES[i - 1], next = PAGES[i + 1];
  let body = `<div class="crumb">${p.group}</div><h1 class="title">${p.title}</h1><p class="lead">${p.lead}</p>`;
  if (p.custom) body += p.custom(s);
  if (p.render) {
    body += `<div class="play-tabs" role="tablist" aria-label="Show"><button type="button" role="tab" data-view="preview" aria-selected="true">Preview</button><button type="button" role="tab" data-view="settings" aria-selected="false">Settings</button></div>
      <div class="play" data-view="preview"><div class="stage" id="stage"><div class="stage-tools"><button type="button" id="replay">Draw again</button></div><div id="preview" data-pt-draw="off"></div></div>
      <div class="ctls"><h3>Parameters</h3>${p.controls.map(c => control(c, s[c.k])).join('')}</div></div>
      <p class="code-label">Code</p>${codeBox('', 'code')}`;
  }
  if (p.after) body += p.after(s);
  body += refTable(p.ref);
  body += `<nav class="pager" aria-label="Pages">${prev ? `<a href="#${prev.id}"><small>Previous</small>${prev.title}</a>` : '<span></span>'}${next ? `<a href="#${next.id}" style="text-align:right"><small>Next</small>${next.title}</a>` : ''}</nav>`;
  main.innerHTML = body;
  main.querySelectorAll('.code .copy').forEach(b => b.addEventListener('click', () => copy(b.previousElementSibling, b)));
  main.querySelectorAll('.pt-swatch[data-kind]').forEach(sw => sw.addEventListener('click', () => {
    const k = sw.dataset.kind, t = sw.dataset.token;
    const sel = document.getElementById('c-' + k);
    if (sel) { sel.value = t; sel.dispatchEvent(new Event('change')); } else if (k === 'pen') kit.setPen(t); else if (k === 'pencil') kit.setPencil(t); else kit.setRibbon(t);

  }));

  if (p.render) {
    const update = (changed) => {
      if (p.onChange && p.onChange(s, changed)) { const ta = document.getElementById('c-src'); if (ta) ta.value = s.src; const ex = document.getElementById('c-example'); if (ex) ex.value = ''; }
      if (p.apply) p.apply(s);
      p.controls.forEach(c => { if (c.when) { const box = main.querySelector(`.ctl[data-k="${c.k}"]`); if (box) box.hidden = !c.when(s); } });
      const markup = p.render(s);
      const prevEl = document.getElementById('preview');
      prevEl.innerHTML = frame(p, markup);
      if (p.post) p.post(s, prevEl);
      document.getElementById('code').textContent = p.code ? p.code(s) : markup;
    };
    p.controls.forEach(c => {
      const el = document.getElementById('c-' + c.k);
      const evt = c.type === 'select' || c.type === 'toggle' ? 'change' : 'input';
      el.addEventListener(evt, () => {
        s[c.k] = c.type === 'range' ? +el.value : c.type === 'toggle' ? el.checked : el.value;
        if (c.type === 'range') document.getElementById(`c-${c.k}-o`).textContent = el.value + (c.unit || '');
        update(c.k);
      });
    });
    update();
    document.getElementById('replay').addEventListener('click', replay);
  }
  main.scrollTop = 0;
  if (location.hash.slice(1) === p.id) window.scrollTo(0, 0);
}
function frame(p, markup) {
  if (p.frame === 'desk') return markup.replace('class="pt-sheet', 'class="pt-sheet paper-own');
  const pad = p.frame === 'pad' ? ' style="padding-top: 48px"' : '';
  return `<div class="pt-sheet" ${sheetAttrs()}${pad}>${markup}</div>`;
}
function replay() {
  const stage = document.getElementById('preview');
  const items = stage.querySelectorAll(DRAWABLE);
  items.forEach((it, i) => it.style.setProperty('--pt-delay', Math.min(i * .12, 1.2).toFixed(2) + 's'));
  drawOnce(stage);
}
// play the drawing once in a live preview, then keep it still so editing does not replay it
function drawOnce(box) {
  html.dataset.ptMotion = '';
  box.setAttribute('data-pt-draw', ''); delete box.dataset.ptDrawn; void box.offsetWidth; box.dataset.ptDrawn = '';
  clearTimeout(box._still); box._still = setTimeout(() => { delete box.dataset.ptDrawn; box.setAttribute('data-pt-draw', 'off'); }, 2800);
}
function copy(pre, btn) {
  const done = m => { btn.textContent = m; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done('Selected'); };
  try { navigator.clipboard.writeText(pre.textContent).then(() => done('Copied'), fallback); } catch (e) { fallback(); }
}

/* ---------- typewriter lab ---------- */
function LAB_HTML() {
  return `<div class="play"><div class="stage"><div class="pt-sheet" ${sheetAttrs()}>
    <span class="tag">With the texture</span><p class="lab-sample pt-nosnap" id="lab-sample"></p>
    <span class="tag">Same font, no texture</span><p class="lab-plain pt-nosnap" id="lab-plain"></p>
  </div></div>
  <div class="ctls"><h3>Parameters</h3>
    <label class="ctl" for="lab-font"><span>Font</span><select id="lab-font">
      ${[["'Courier Prime', monospace", 'Courier Prime'], ["'IBM Plex Mono', monospace", 'IBM Plex Mono'], ["'JetBrains Mono', monospace", 'JetBrains Mono'], ["'Space Mono', monospace", 'Space Mono'], ["'Courier New', monospace", 'Courier New (system)'], ["'Work Sans', sans-serif", 'Work Sans'], ["'DM Sans', sans-serif", 'DM Sans'], ['Archivo, sans-serif', 'Archivo'], ['Helvetica, Arial, sans-serif', 'Helvetica / Arial'], ['system-ui, sans-serif', 'System UI']].map(([v, l]) => `<option value="${esc(v)}">${l}</option>`).join('')}
    </select></label>
    ${[['spread', 'Ink spread', 0, 1, .05, .6], ['rough', 'Rough edges', 0, 3, .1, 1.2], ['uneven', 'Uneven ribbon', 0, 1, .05, .7], ['speckle', 'Worn speckles', 0, 1, .05, .5], ['double', 'Double strike', 0, 1, .05, .35], ['wobble', 'Letter wobble', 0, 1, .05, .5]].map(([k, l, mi, ma, st, v]) => `<label class="ctl" for="lab-${k}"><span>${l}<output id="lab-${k}-o">${v}</output></span><input type="range" id="lab-${k}" data-key="${k}" min="${mi}" max="${ma}" step="${st}" value="${v}"></label>`).join('')}
    <label class="ctl wide" for="lab-text"><span>Sample text</span><input type="text" id="lab-text" value="Every month, I carve some time to help founders with their marketing."></label>
  </div></div>
  <p class="code-label">Code</p>${codeBox('', 'lab-code')}`;
}
function mountLab() {
  const lab = { spread: .6, rough: 1.2, uneven: .7, speckle: .5, double: .35, wobble: .5 };
  const sample = document.getElementById('lab-sample'), plain = document.getElementById('lab-plain');
  const font = document.getElementById('lab-font'), text = document.getElementById('lab-text'), code = document.getElementById('lab-code');
  const shadow = d => d > 0 ? `${(d * .7).toFixed(2)}px ${(d * .25).toFixed(2)}px 0 color-mix(in srgb, currentColor ${Math.round(d * 55)}%, transparent)` : 'none';
  function render() {
    document.getElementById('lab-defs').innerHTML = PT.typewriterFilter('tw-lab', lab);
    sample.style.fontFamily = plain.style.fontFamily = font.value;
    const t = text.value || ' ';
    plain.textContent = t; sample.textContent = '';
    let seed = 1234; const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    t.split(/(\s+)/).forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) { sample.appendChild(document.createTextNode(part)); return; }
      const w = document.createElement('span'); w.style.whiteSpace = 'nowrap';
      for (const ch of part) {
        const s = document.createElement('span'); s.className = 'c'; s.textContent = ch;
        s.style.transform = `translateY(${((r() - .5) * 1.8 * lab.wobble).toFixed(2)}px) rotate(${((r() - .5) * 3.2 * lab.wobble).toFixed(2)}deg)`;
        s.style.opacity = (1 - r() * .24 * lab.wobble).toFixed(2);
        w.appendChild(s);
      }
      sample.appendChild(w);
    });
    sample.style.textShadow = shadow(lab.double);
    sample.style.filter = 'none'; void sample.offsetWidth; sample.style.filter = '';
    code.textContent = `// with the script
kit.setTypewriter({ spread: ${lab.spread}, rough: ${lab.rough}, uneven: ${lab.uneven}, speckle: ${lab.speckle} });

/* then on any text */
.my-heading {
  font-family: ${font.value};
  filter: url(#pt-typewriter);
  text-shadow: ${shadow(lab.double)};
  --pt-wobble: ${(lab.wobble * 2).toFixed(1)};   /* with class="pt-wobble" */
}`;
  }
  document.querySelectorAll('[id^="lab-"][type="range"]').forEach(inp => inp.addEventListener('input', () => { lab[inp.dataset.key] = +inp.value; document.getElementById(`lab-${inp.dataset.key}-o`).textContent = inp.value; render(); }));
  font.addEventListener('change', render); text.addEventListener('input', render);
  render();
}
