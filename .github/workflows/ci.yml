name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      # dist/ is committed, so it must be what the source builds to. The site
      # no longer holds copies of it: it is generated, and the site job below
      # is what holds that to the source.
      - name: Built files match the source
        run: git diff --exit-code -- dist
      - name: The README states the sizes dist actually has
        run: npm run check:sizes
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  site:
    # The site is generated by package-site, which package-lock.json pins, so
    # this runs here rather than only on one machine. Its own job: docs/ never
    # ships in the tarball, so a site failure must not read as a package one.
    #
    # build:docs first, then the diff: docs/ is committed output, and the way
    # it goes wrong is an edit to site/pages.js with no rebuild. A check that
    # read the committed copy would pass on exactly that mistake.
    runs-on: ubuntu-latest
    steps:
      # Full history: the changelog page and the feed date each release from
      # `git log -S` over CHANGELOG.md, and a shallow clone has none of it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - name: docs/ is in step with the source
        run: git diff --exit-code docs/
      - run: npm run check:docs
