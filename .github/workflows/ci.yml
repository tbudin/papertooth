name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/ and the docs copies are committed, so they must be what the source builds to
      - name: Built files match the source
        run: git diff --exit-code -- dist docs/papertooth.min.css docs/papertooth.min.js
      - name: The README states the sizes dist actually has
        run: npm run check:sizes
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
